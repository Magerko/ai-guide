name: External links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The script always exits 0: broken links are reported in the job summary, not blocking.
      - run: pnpm check:external
